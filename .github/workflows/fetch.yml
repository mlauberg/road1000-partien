# Holt neue Rapid Partien von chess.com und committet sie nach inbox/.
# Ausloeser: ein Push auf request.txt (macht `python3 analyze.py --fetch` aus dem Claude Chat) oder der Knopf
# "Run workflow" bei GitHub. Kein Zeitplan: geholt wird, wenn Q "Analyse" sagt.
# Schreibt bei jedem Lauf inbox/.last_run.txt, daran erkennt analyze.py --fetch, dass der Lauf fertig ist.
name: fetch
on:
  workflow_dispatch:
  push:
    paths: ["request.txt"]
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Partien holen
        id: holen
        continue-on-error: true
        env:
          ROAD1000_CONTACT: ${{ secrets.ROAD1000_CONTACT }}
        run: python3 fetch_chesscom.py
      - name: Ergebnis pushen (Marke auch bei Fehler, damit --fetch nicht wartet)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ Lauf ${{ github.run_id }} ${{ steps.holen.outcome }}" > inbox/.last_run.txt
          git config user.name "road1000 fetch"
          git config user.email "fetch@users.noreply.github.com"
          git add -A inbox
          git commit -qm "Abruf $(date -u +%Y-%m-%d_%H:%M)" || true
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
